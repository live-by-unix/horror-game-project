<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#1a1a2e" rx="64"/>
  
  <!-- Pickaxe Handle -->
  <rect x="240" y="80" width="32" height="352" rx="4" fill="#8B4513" stroke="#5D3A1A" stroke-width="3"/>
  
  <!-- Handle Wood Grain Details -->
  <line x1="250" y1="100" x2="250" y2="130" stroke="#5D3A1A" stroke-width="2" opacity="0.5"/>
  <line x1="262" y1="150" x2="262" y2="180" stroke="#5D3A1A" stroke-width="2" opacity="0.5"/>
  <line x1="250" y1="200" x2="250" y2="230" stroke="#5D3A1A" stroke-width="2" opacity="0.5"/>
  <line x1="262" y1="250" x2="262" y2="280" stroke="#5D3A1A" stroke-width="2" opacity="0.5"/>
  <line x1="250" y1="300" x2="250" y2="330" stroke="#5D3A1A" stroke-width="2" opacity="0.5"/>
  <line x1="262" y1="350" x2="262" y2="380" stroke="#5D3A1A" stroke-width="2" opacity="0.5"/>
  
  <!-- Pickaxe Head - Horizontal Blade -->
  <polygon points="80,200 432,200 432,240 80,240" fill="#4A4A4A" stroke="#2C2C2C" stroke-width="3"/>
  <polygon points="80,200 432,200 432,210 80,210" fill="#5A5A5A" opacity="0.7"/>
  
  <!-- Horizontal Blade Points -->
  <polygon points="80,200 60,220 80,240" fill="#3A3A3A" stroke="#2C2C2C" stroke-width="2"/>
  <polygon points="432,200 452,220 432,240" fill="#3A3A3A" stroke="#2C2C2C" stroke-width="2"/>
  
  <!-- Pickaxe Head - Vertical Blade -->
  <polygon points="240,60 272,60 272,120 240,120" fill="#4A4A4A" stroke="#2C2C2C" stroke-width="3"/>
  <polygon points="240,60 272,60 272,70 240,70" fill="#5A5A5A" opacity="0.7"/>
  
  <!-- Vertical Blade Point -->
  <polygon points="240,60 256,30 272,60" fill="#3A3A3A" stroke="#2C2C2C" stroke-width="2"/>
  
  <!-- Head Connection Joint -->
  <ellipse cx="256" cy="200" rx="20" ry="12" fill="#3A3A3A" stroke="#2C2C2C" stroke-width="2"/>
  <ellipse cx="256" cy="120" rx="12" ry="20" fill="#3A3A3A" stroke="#2C2C2C" stroke-width="2"/>
  
  <!-- Metal Shine Effects -->
  <line x1="100" y1="205" x2="150" y2="205" stroke="#6A6A6A" stroke-width="2" opacity="0.5"/>
  <line x1="360" y1="205" x2="410" y2="205" stroke="#6A6A6A" stroke-width="2" opacity="0.5"/>
  <line x1="248" y1="70" x2="248" y2="90" stroke="#6A6A6A" stroke-width="2" opacity="0.5"/>
  
  <!-- Subtle blood/dirt stains for horror theme -->
  <circle cx="120" cy="230" r="8" fill="#8B0000" opacity="0.4"/>
  <circle cx="380" cy="215" r="6" fill="#8B0000" opacity="0.3"/>
  <circle cx="256" cy="90" r="5" fill="#8B0000" opacity="0.35"/>
  
  <!-- Handle grip wrap -->
  <rect x="238" y="380" width="36" height="40" rx="2" fill="#2C1810" opacity="0.6"/>
  <line x1="242" y1="385" x2="242" y2="415" stroke="#1A0F0A" stroke-width="2"/>
  <line x1="254" y1="385" x2="254" y2="415" stroke="#1A0F0A" stroke-width="2"/>
  <line x1="266" y1="385" x2="266" y2="415" stroke="#1A0F0A" stroke-width="2"/>
</svg>